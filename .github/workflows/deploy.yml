name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Un despliegue a la vez: evita que dos push seguidos se pisen en el servidor.
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Etiquetas de la imagen
        run: |
          echo "tags=${IMAGE_NAME,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag por commit (lo que se despliega) + latest (referencia móvil).
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cloudflared
        run: |
          curl --fail --silent --show-error \
            --location \
            --output cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"

          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Verificar cloudflared
        run: cloudflared --version

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configurar SSH sobre Cloudflare Access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host ssh.carlos-po.dev
              User ${{ secrets.SSH_USER }}
              IdentityFile ~/.ssh/id_deploy
              UserKnownHostsFile ~/.ssh/known_hosts
              StrictHostKeyChecking yes
              ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}
          EOF

          chmod 600 ~/.ssh/config

      - name: Probar Cloudflare Access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          timeout 15s cloudflared access ssh \
            --hostname "$SSH_HOST" \
            --service-token-id "$CF_ACCESS_CLIENT_ID" \
            --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
            --loglevel debug || true
            
      - name: Copiar docker-compose.yml al servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"

          scp docker-compose.yml \
            "$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Desplegar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.build-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$SSH_HOST" \
            IMAGE="$IMAGE" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            'bash -euo pipefail -s' <<'REMOTE'

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GHCR_USER" \
            --password-stdin

          cd "$DEPLOY_PATH"

          IMAGE="$IMAGE" docker compose pull

          IMAGE="$IMAGE" docker compose up -d --remove-orphans

          docker image prune -f

          docker logout ghcr.io

          REMOTE

      - name: Comprobar que responde
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://profile.carlos-po.dev/ || true)
            if [ "$code" = "200" ]; then echo "OK ($code)"; exit 0; fi
            echo "intento $i: $code"; sleep 6
          done
          echo "El sitio no respondió 200 tras el despliegue"; exit 1
